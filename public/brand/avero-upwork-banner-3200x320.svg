    <text x="1450" y="260" fill="#5EEAD4">DATA</text>
  </g>

  <g transform="translate(2680,48)" opacity="0.55">
    <rect x="24" y="118" width="220" height="7" rx="3.5" fill="#0D8F9C"/>
    <path d="M134 16 48 232h36l16-38h68l16 38h36L134 16Z" fill="none" stroke="#5EEAD4" stroke-width="5"/>
