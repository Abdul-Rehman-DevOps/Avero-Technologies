    <rect x="760" y="236" width="132" height="36" rx="18" fill="#0D8F9C" fill-opacity="0.18" stroke="#0D8F9C" stroke-opacity="0.45"/>
    <text x="786" y="260" fill="#5EEAD4">SOFTWARE</text>

    <rect x="908" y="236" width="108" height="36" rx="18" fill="#0D8F9C" fill-opacity="0.18" stroke="#0D8F9C" stroke-opacity="0.45"/>
    <text x="934" y="260" fill="#5EEAD4">CLOUD</text>

    <rect x="1032" y="236" width="72" height="36" rx="18" fill="#0D8F9C" fill-opacity="0.18" stroke="#0D8F9C" stroke-opacity="0.45"/>
    <text x="1056" y="260" fill="#5EEAD4">AI</text>

    <rect x="1120" y="236" width="140" height="36" rx="18" fill="#0D8F9C" fill-opacity="0.18" stroke="#0D8F9C" stroke-opacity="0.45"/>
    <text x="1144" y="260" fill="#5EEAD4">PLATFORM</text>

    <rect x="1276" y="236" width="132" height="36" rx="18" fill="#0D8F9C" fill-opacity="0.18" stroke="#0D8F9C" stroke-opacity="0.45"/>
