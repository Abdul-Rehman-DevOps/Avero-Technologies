<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="320" viewBox="0 0 3200 320" role="img" aria-label="Avero Technologies Upwork agency banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="35%" stop-color="#0A1828"/>
      <stop offset="100%" stop-color="#0C3A44"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D8F9C"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07111F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#07111F" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#0D8F9C" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="3200" height="320" fill="url(#bg)"/>
  <rect width="3200" height="320" fill="url(#grid)"/>
  <circle cx="2500" cy="160" r="260" fill="#0D8F9C" fill-opacity="0.10"/>
  <circle cx="3000" cy="40" r="140" fill="#5EEAD4" fill-opacity="0.07"/>

  <!-- Avatar safe zone: quiet left side -->
  <rect x="0" y="0" width="720" height="320" fill="url(#fadeL)"/>

  <rect x="760" y="92" width="120" height="5" rx="2.5" fill="url(#beam)"/>

  <text x="760" y="160" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#F4F7FB">Systems built for production.</text>
  <text x="760" y="205" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#A8B7CC">Software, cloud, AI, platforms, security, and data engineering.</text>

